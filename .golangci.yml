run:
  timeout: 5m
  go: "1.23"

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - revive
    - gocyclo
    - misspell
    - bodyclose

linters-settings:
  gocyclo:
    min-complexity: 18

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocyclo
